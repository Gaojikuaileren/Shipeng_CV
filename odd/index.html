<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shipeng Ouyang — Part-time</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />

  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/screen.css" />
  <link rel="stylesheet" href="../styles/print.css" />
</head>
<!-- cv-onepager：本页四语都是单页，豁免 print.css 里「联系方式排到第 2 页」那条
     —— 单页简历强制分页会凭空多出一张纸。将来内容长到两页就把这个类去掉。 -->
<body class="cv-onepager">
  <nav class="cv-toolbar no-print">
    <div class="cv-toolbar-side"></div>
    <div class="cv-toolbar-side">
      <div class="lang-switch" id="lang-switch"></div>
      <button class="tool-btn" id="btn-copy" type="button"><span class="btn-ico">⧉</span> <span class="btn-label">Copy</span></button>
      <button class="tool-btn tool-btn--primary" id="btn-pdf" type="button"><span class="btn-ico">↓</span> <span class="btn-label">PDF</span></button>
    </div>
  </nav>

  <main id="cv-root" class="cv-root"></main>

  <!-- 独立数据（不引用主站 base.js，彻底隔离）-->
  <script src="./data.js"></script>
  <script src="../scripts/stats.js"></script>
  <script src="../scripts/i18n-ui.js"></script>
  <script src="../scripts/i18n.js"></script>
  <script src="../scripts/identity.js"></script>
  <script src="../scripts/render.js"></script>
  <script src="../scripts/export/pdf.js"></script>
  <script src="../scripts/export/text.js"></script>
  <script src="../scripts/pdf-hint.js"></script>
  <script>
    // 兼职页极简启动：直接用本页 data.js 的 RESUME_BASE，不走变体系统
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.RESUME_BASE) return;
      if (window.Stats) window.Stats.ping("odd");
      window.Identity.init();
      window.I18n.init(RESUME_BASE.meta);
      window.toast = window.toast || function (m) { console.log(m); };
      var data = Object.assign({ sections: {
        order: ["intro", "oddjobs", "languages", "education"],
        hide: ["skills", "toolset", "moreWorks", "projects", "work", "portfolio"],
        emphasize: []
      } }, RESUME_BASE);

      function boot() { window.Render.all(data); }
      boot();
      window.I18n.onChange(boot);

      var box = document.getElementById("lang-switch");
      RESUME_BASE.meta.langs.forEach(function (lng) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "lang-btn" + (lng === I18n.current ? " active" : "");
        b.dataset.lang = lng;
        b.textContent = RESUME_BASE.meta.langLabels[lng] || lng;
        b.addEventListener("click", function () { I18n.set(lng); });
        box.appendChild(b);
      });
      I18n.onChange(function () {
        document.querySelectorAll(".lang-btn").forEach(function (b) {
          b.classList.toggle("active", b.dataset.lang === I18n.current);
        });
      });

      var pdf = document.getElementById("btn-pdf");
      if (pdf) pdf.addEventListener("click", function () { if (window.Stats) window.Stats.pdfHit("odd"); window.Exporter.resumePDF(); });
      var copy = document.getElementById("btn-copy");
      if (copy) copy.addEventListener("click", function () { window.Exporter.copySummary(data); });

      // 照片防护：禁用右键菜单（配合 CSS 禁选中 / 拖拽 / 长按）
      document.addEventListener("contextmenu", function (e) {
        if (e.target && e.target.closest && e.target.closest(".cv-photo")) e.preventDefault();
      });

      if (window.PdfHint) window.PdfHint.show();
    });
  </script>
</body>
</html>
