<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shipeng Ouyang — CV / Portfolio</title>

  <!-- 隐私：禁止搜索引擎索引（靠分发链接传播，不靠被搜到）-->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="CV and portfolio of Shipeng Ouyang — UE5 developer, media artist, VR and virtual production. Based in Cologne." />
  <!-- 分享预览卡片（IM / 邮件 / 社媒）-->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shipeng Ouyang — CV / Portfolio" />
  <meta property="og:description" content="UE5 developer · media artist · VR & interaction design · Cologne" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- 预加载关键字重，加速首屏字体渲染 -->
  <link rel="preload" href="assets/fonts/hanken-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/hanken-latin-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/hanken-latin-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/screen.css" />
  <link rel="stylesheet" href="styles/motion.css" />
  <!-- 打印样式对屏幕毫无用处，media="print" 让它不再阻塞首屏渲染 -->
  <link rel="stylesheet" href="styles/print.css" media="print" />

  <!-- 变体注册表（短链 ↔ 内部 ID）。必须排在下面那段之前：裸入口判定要用它解析 ?v= -->
  <script src="scripts/variants.js"></script>

  <!-- 短链解析 ＋ 裸入口拦截（同步执行，须在 body 渲染前判定，防工具栏闪现暴露内容）
       1) ?v=mn 这类指向独立页面的 → 整页跳过去（此时本页还没渲染、也还没打点）
       2) 认不出来的 ?v= 且非本人模式 → 占位
       3) 旧的长 ID（?v=ue5-tech，已经发出去的链接与 PDF 二维码）→ 照常渲染，
          只把地址栏静默换成短链：replaceState 不重载、不跳转，因此不会多记一次访问 -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var r = window.VARIANTS.resolve(p.get("v"));

      if (r.redirect) {
        p.delete("v");                       // 目标页面自己就是那个变体，不需要再带 v
        var q = p.toString();
        location.replace(r.redirect + (q ? "?" + q : "") + location.hash);
        return;
      }

      var full = p.get("mode") === "full";
      var saved = false; try { saved = localStorage.getItem("cv-mode") === "full"; } catch (e) {}
      if (!r.id && !full && !saved) {
        window.__BLANK__ = true;
        document.documentElement.className += " blank";
        document.title = "·"; // 标签页标题也不暴露姓名 / CV
        return;
      }

      if (r.short && p.get("v") !== r.short) {
        p.set("v", r.short);
        try {
          history.replaceState(null, "", location.pathname + "?" + p.toString() + location.hash);
        } catch (e) {} // file:// 下 replaceState 会抛，静默忽略：地址栏好不好看不值得挡住渲染
      }
    })();
  </script>
  <style>
    /* 占位页：裸入口只见一个居中的点，不暴露任何内容 */
    html.blank body > * { display: none !important; }
    html.blank body::after { content: "·"; position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; color: #141414; font: 1.6rem sans-serif; }
  </style>
</head>
<body>
  <!-- 顶部工具栏（打印时隐藏）-->
  <nav class="cv-toolbar no-print" aria-label="工具栏 / Toolbar">
    <div class="cv-toolbar-side">
      <span class="full-only" id="variant-badge"></span>
      <button class="tool-btn full-only" id="btn-exit-full" type="button">Exit full</button>
    </div>
    <div class="cv-toolbar-side">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="语言 / Language"></div>
      <button class="tool-btn" id="btn-copy" type="button" aria-label="复制摘要 / Copy"><span class="btn-ico" aria-hidden="true">⧉</span> <span class="btn-label">Copy</span></button>
      <button class="tool-btn" id="btn-card" type="button" aria-label="名片 / Business card"><span class="btn-ico" aria-hidden="true">▭</span> <span class="btn-label">Card</span></button>
      <button class="tool-btn tool-btn--primary" id="btn-pdf" type="button" aria-label="导出 PDF"><span class="btn-ico" aria-hidden="true">↓</span> <span class="btn-label">PDF</span></button>
    </div>
  </nav>

  <!-- 简历主体（JS 渲染）-->
  <main id="cv-root" class="cv-root"></main>

  <!-- 名片（屏幕隐藏，导出/打印名片时显示）-->
  <div id="cv-card" aria-hidden="true"></div>

  <!-- 名片弹窗（点 Card 打开）-->
  <div id="card-modal" class="card-modal no-print" role="dialog" aria-modal="true" hidden>
    <div class="card-modal-backdrop" data-close></div>
    <div class="card-modal-panel">
      <div class="card-modal-bar">
        <!-- label 由 card.js 按平台动态设置：iOS/Mac=Share，其他=Copy Link -->
        <button type="button" class="tool-btn" data-share id="btn-card-share">⤴ Share</button>
        <button type="button" class="tool-btn tool-btn--primary" data-download>↓ PNG</button>
        <button type="button" class="tool-btn" data-close aria-label="Close">✕</button>
      </div>
      <div class="card-preview" id="card-preview"></div>
    </div>
  </div>

  <!-- 数据（base 静态加载；variant 由 data-loader 按 ?v= 动态注入）-->
  <script src="data/base.js" defer></script>

  <!-- 核心 -->
  <script src="scripts/stats.js" defer></script>
  <script src="scripts/i18n-ui.js" defer></script>
  <script src="scripts/i18n.js" defer></script>
  <script src="scripts/identity.js" defer></script>
  <script src="scripts/data-loader.js" defer></script>
  <script src="scripts/duration.js" defer></script>
  <script src="scripts/render.js" defer></script>

  <!-- 导出层 -->
  <script src="scripts/lib/qrcode.js" defer></script>
  <script src="scripts/export/qr.js" defer></script>
  <script src="scripts/export/pdf.js" defer></script>
  <script src="scripts/export/card.js" defer></script>
  <script src="scripts/export/text.js" defer></script>

  <!-- 交互层（预留）-->
  <script src="scripts/interactions/index.js" defer></script>

  <!-- 引导气泡（指向 PDF 按钮）-->
  <script src="scripts/pdf-hint.js" defer></script>

  <!-- 入口（最后）-->
  <script src="scripts/main.js" defer></script>
</body>
</html>
