<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>·</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper-2); font-family: var(--font-sans);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .console { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 18px; }

    /* 指令输入框 */
    .cmd-wrap { width: 100%; display: flex; border: 1px solid var(--line-ink); background: #fff; }
    .cmd-wrap.shake { animation: shake .3s; border-color: var(--accent); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    #cmd { flex: 1; border: none; outline: none; background: none; font-family: var(--font-mono);
      font-size: 1.15rem; padding: 14px 16px; color: var(--ink); letter-spacing: .04em; }
    #send { border: none; background: var(--ink); color: #fff; padding: 0 18px; cursor: pointer; font-size: 1.1rem; }
    #send:hover { background: var(--accent); }

    /* 底端两数字（合计） */
    .stats { font-family: var(--font-mono); font-size: .82rem; color: var(--ink-faint); letter-spacing: .05em;
      display: flex; gap: 20px; }
    .stats b { color: var(--ink); font-weight: 600; }

    /* 清零 / 操作反馈（顶部浮现，自动消失） */
    .flash { position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
      font-family: var(--font-mono); font-size: .78rem; color: var(--accent); background: #fff;
      border: 1px solid var(--accent); padding: 7px 16px; letter-spacing: .04em;
      opacity: 0; pointer-events: none; transition: opacity .25s; }
    .flash.show { opacity: 1; }

    /* /sdata 数据视图 */
    .data { width: 100%; max-width: 460px; margin-top: 10px; display: none; }
    .data.show { display: block; }
    .data-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
      font-family: var(--font-mono); font-size: .72rem; color: var(--ink-faint); letter-spacing: .08em; }
    .data-close { border: none; background: none; color: var(--ink-faint); cursor: pointer; font-size: 1rem; }
    .data-close:hover { color: var(--ink); }

    /* 分职业表格 */
    .stat-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono);
      font-size: .84rem; margin-bottom: 20px; }
    .stat-table th { font-weight: 500; color: var(--ink-faint); text-align: right; padding: 0 0 8px;
      font-size: .7rem; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
    .stat-table th:first-child { text-align: left; }
    .stat-table td { padding: 7px 0; text-align: right; color: var(--ink); border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums; }
    .stat-table td.n { text-align: left; color: var(--ink-soft); }
    .stat-table tr.sum td { border-top: 1px solid var(--line-ink); border-bottom: none; padding-top: 9px; font-weight: 600; }
    .stat-table tr.sum td.n { color: var(--ink); }

    /* 访问时间线 */
    .log-title { font-family: var(--font-mono); font-size: .7rem; color: var(--ink-faint); letter-spacing: .08em; margin-bottom: 6px; }
    .log { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow: auto; border-top: 1px solid var(--line); }
    .log li { font-family: var(--font-mono); font-size: .74rem; color: var(--ink-soft);
      padding: 5px 2px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
    .log .i { color: var(--ink-faint); min-width: 26px; text-align: right; }
    .log .who { color: var(--accent); min-width: 52px; font-size: .68rem; }
    .log .t { color: var(--ink-soft); }
    .log-empty { font-family: var(--font-mono); font-size: .76rem; color: var(--ink-faint); padding: 12px 2px; }
  </style>
</head>
<body>
  <div class="flash" id="flash"></div>

  <main class="console">
    <div class="cmd-wrap" id="wrap">
      <input id="cmd" placeholder="" autocomplete="off" autofocus />
      <button id="send" type="button" aria-label="执行">↵</button>
    </div>
    <div class="stats" id="stats"><span>Σ <b id="st-total">—</b></span><span>W <b id="st-week">—</b></span></div>
  </main>

  <div class="data" id="data">
    <div class="data-head"><span id="data-title">ACCESS</span><button class="data-close" id="data-close" aria-label="关闭">✕</button></div>
    <table class="stat-table" id="stat-table"></table>
    <div class="log-title">最近访问</div>
    <ul class="log" id="log"></ul>
  </div>

  <script src="scripts/stats.js"></script>
  <script>
    var dir = location.href.replace(/[^/]*(\?.*)?(#.*)?$/, ""); // 本页目录
    // 路由一律走短链（唯一真相在 scripts/variants.js；这里写死是因为本页不加载它，
    // 只有五条、且与那张表一一对应 —— 改短链时两处一起改）
    var ROUTES = { "/s01": "?v=ue", "/s02": "?v=fl", "/s03": "?v=ds", "/s04": "odd/", "/s05": "?v=cd" };
    var NAMES = { "ue5-tech": "UE5 + AI", "art-vr": "媒体艺术", "designer": "设计师", "odd": "兼职", "china-biz": "中德商务" };
    var ORDER = ["ue5-tech", "art-vr", "designer", "odd", "china-biz"];
    var CLEAN = { "/clean01": "ue5-tech", "/clean02": "art-vr", "/clean03": "designer", "/clean04": "odd", "/clean05": "china-biz", "/cleanall": "all" };

    var cmd = document.getElementById("cmd");
    var wrap = document.getElementById("wrap");
    var dataEl = document.getElementById("data");
    var flashEl = document.getElementById("flash");

    function flash(msg) {
      flashEl.textContent = msg;
      flashEl.classList.add("show");
      clearTimeout(flashEl._t);
      flashEl._t = setTimeout(function () { flashEl.classList.remove("show"); }, 2200);
    }

    function run() {
      var v = cmd.value.trim().toLowerCase();
      // 查表走 hasOwnProperty：裸对象会把 constructor / __proto__ 这类原型键也认成命令
      if (Object.prototype.hasOwnProperty.call(ROUTES, v)) { location.href = dir + ROUTES[v]; return; }
      if (v === "/sdata") { cmd.value = ""; showData(); return; }
      if (Object.prototype.hasOwnProperty.call(CLEAN, v)) { cmd.value = ""; doClean(CLEAN[v]); return; }
      // 无效指令：抖动提示（无文字）
      wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
    }
    cmd.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
    document.getElementById("send").addEventListener("click", run);
    document.getElementById("data-close").addEventListener("click", function () { dataEl.classList.remove("show"); cmd.focus(); });

    function fmt(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      var p = function (n) { return n < 10 ? "0" + n : n; };
      return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function showData() {
      dataEl.classList.add("show");
      var table = document.getElementById("stat-table");
      var log = document.getElementById("log");
      table.innerHTML = "";
      log.innerHTML = '<li class="log-empty">加载中…</li>';
      if (!window.Stats || !window.Stats._ready()) { log.innerHTML = '<li class="log-empty">统计未配置</li>'; return; }
      window.Stats.data().then(function (d) {
        renderStats(d); renderTable(d); renderLog(d);
      }).catch(function () { log.innerHTML = '<li class="log-empty">读取失败</li>'; });
    }

    function renderTable(d) {
      var table = document.getElementById("stat-table");
      var vs = d.variants || {};
      var head = '<thead><tr><th></th><th>访问</th><th>PDF</th><th>扫码</th><th>本周</th></tr></thead>';
      var body = '<tbody>';
      ORDER.forEach(function (id) {
        var x = vs[id] || { visits: 0, pdf: 0, works: 0, thisWeek: 0 };
        body += '<tr><td class="n">' + NAMES[id] + '</td><td>' + (x.visits||0) + '</td><td>' + (x.pdf||0) + '</td><td>' + (x.works||0) + '</td><td>' + (x.thisWeek||0) + '</td></tr>';
      });
      body += '<tr class="sum"><td class="n">合计</td><td>' + (d.total||0) + '</td><td>' + (d.totalPdf||0) + '</td><td>' + (d.totalWorks||0) + '</td><td>' + (d.thisWeek||0) + '</td></tr>';
      body += '</tbody>';
      table.innerHTML = head + body;
    }

    function renderLog(d) {
      var log = document.getElementById("log");
      var vs = d.variants || {};
      var all = [];
      ORDER.forEach(function (id) {
        ((vs[id] && vs[id].log) || []).forEach(function (iso) { all.push({ iso: iso, who: NAMES[id] }); });
      });
      all.sort(function (a, b) { return a.iso < b.iso ? 1 : (a.iso > b.iso ? -1 : 0); }); // 新→旧
      if (!all.length) { log.innerHTML = '<li class="log-empty">暂无访问记录</li>'; return; }
      log.innerHTML = "";
      all.forEach(function (item, i) {
        var li = document.createElement("li");
        var idx = document.createElement("span"); idx.className = "i"; idx.textContent = (all.length - i);
        var who = document.createElement("span"); who.className = "who"; who.textContent = item.who;
        var t = document.createElement("span"); t.className = "t"; t.textContent = fmt(item.iso);
        li.appendChild(idx); li.appendChild(who); li.appendChild(t); log.appendChild(li);
      });
    }

    function renderStats(d) {
      document.getElementById("st-total").textContent = d.total != null ? d.total : "—";
      document.getElementById("st-week").textContent = d.thisWeek != null ? d.thisWeek : "—";
    }

    /* 清零密钥：不写进任何文件，第一次用的时候问一次，之后本机记住。
       防的是「不懂技术的人误点」，不是防技术人员 —— 所以用 localStorage 而不是
       sessionStorage：你自己在这台机器上输一次就够，不必每开一次标签页重来。
       真要清掉记忆：控制台 localStorage.removeItem("cv-rst")。 */
    function resetKey() {
      var k = localStorage.getItem("cv-rst");
      if (!k) {
        k = window.prompt("清零密钥");
        if (!k) return null;
        localStorage.setItem("cv-rst", k.trim());
      }
      return localStorage.getItem("cv-rst");
    }
    function doReset(v, k) {
      return fetch(window.Stats.URL + "/reset?v=" + encodeURIComponent(v) + "&k=" + encodeURIComponent(k),
        { method: "POST", mode: "cors" }).then(function (r) { return r.json(); });
    }

    function doClean(v) {
      if (!window.Stats || !window.Stats._ready()) { flash("统计未配置"); return; }
      var label = v === "all" ? "全部" : NAMES[v];
      // 清零不可撤销，而 /cleanall 与 /clean01 只差几个字符 —— 全清必须再确认一次。
      // 单个变体不拦：误清一个的代价小，天天用的命令不该每次都弹窗。
      if (v === "all" && !window.confirm("清空全部变体的访问记录（含时间戳）？此操作不可撤销。")) {
        flash("已取消");
        return;
      }
      var key = resetKey();
      if (!key) { flash("已取消"); return; }
      doReset(v, key).then(function (r) {
        if (r && r.error === "forbidden") { localStorage.removeItem("cv-rst"); flash("密钥不对"); return; }
        if (r && r.ok) {
          flash(label + " 已清零");
          window.Stats.data().then(function (d) {
            renderStats(d);
            if (dataEl.classList.contains("show")) { renderTable(d); renderLog(d); }
          }).catch(function () {});
        } else {
          flash("清零失败" + (r && r.error ? "：" + r.error : ""));
        }
      }).catch(function () { flash("清零失败"); });
      // 注：密钥错了会走上面那条 forbidden 分支并清掉记住的值，下次会重新问
    }

    // 载入时取底端两数字
    if (window.Stats && window.Stats._ready()) {
      window.Stats.data().then(renderStats).catch(function () {});
    }
  </script>
</body>
</html>
