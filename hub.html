<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>·</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%232f5043"/><text x="50" y="74" font-size="60" fill="white" font-family="sans-serif" text-anchor="middle">S</text></svg>' />

  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper-2);
      font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .hub-grid { width: 100%; max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 520px) { .hub-grid { grid-template-columns: 1fr; gap: 14px; } }

    .hub-card { position: relative; aspect-ratio: 3 / 2; background: #fff; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: inset 5px 0 0 transparent; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .hub-card:hover { border-color: var(--ink); box-shadow: inset 5px 0 0 var(--accent); transform: translateY(-3px); }
    .hub-card.is-primary { box-shadow: inset 5px 0 0 var(--accent); }
    .hub-no { font-family: var(--font-mono); font-size: clamp(3rem, 11vw, 5rem); font-weight: 700;
      color: var(--ink); letter-spacing: -.03em; line-height: 1; }

    .hub-copy { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px;
      border: 1px solid var(--line); background: #fff; color: var(--ink-soft); cursor: pointer;
      font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s, border-color .15s; }
    .hub-copy:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
    .hub-copy.done { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hub-copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="hub-grid" id="grid"></div>

  <script>
    var V = [
      { no: "01", target: "?v=ue5-tech", primary: true },
      { no: "02", target: "?v=art-vr" },
      { no: "03", target: "?v=designer" },
      { no: "04", target: "odd/" },
    ];
    var dir = location.href.replace(/[^/]*(\?.*)?(#.*)?$/, ""); // 本页所在目录
    var grid = document.getElementById("grid");

    V.forEach(function (v) {
      var card = document.createElement("div");
      card.className = "hub-card" + (v.primary ? " is-primary" : "");
      card.dataset.target = v.target;
      var no = document.createElement("span");
      no.className = "hub-no"; no.textContent = v.no;
      var copy = document.createElement("button");
      copy.className = "hub-copy"; copy.type = "button";
      copy.dataset.target = v.target; copy.setAttribute("aria-label", "复制链接 " + v.no);
      copy.textContent = "⧉";
      card.appendChild(no); card.appendChild(copy);
      grid.appendChild(card);
    });

    grid.addEventListener("click", function (e) {
      var copy = e.target.closest(".hub-copy");
      if (copy) {
        e.stopPropagation();
        var url = dir + copy.dataset.target;
        var ok = function () { copy.classList.add("done"); copy.textContent = "✓";
          setTimeout(function () { copy.classList.remove("done"); copy.textContent = "⧉"; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, ok);
        else { var t = document.createElement("textarea"); t.value = url; document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); } catch (_) {} document.body.removeChild(t); ok(); }
        return;
      }
      var card = e.target.closest(".hub-card");
      if (card) location.href = dir + card.dataset.target;
    });
  </script>
</body>
</html>
